name: Validate BCMR well-known resolver

on:
  push:
    branches:
      - fix/bcmr-well-known-resolution

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build candidate from exact source anchors
        run: python3 .github/atanatus_build_bcmr_candidate.py

      - name: Verify patch scope
        run: test "$(git diff --name-only)" = "workers/src/bcmr_onchain.rs"

      - name: Rust format check
        working-directory: workers
        run: cargo fmt -- --check

      - name: Targeted regression test
        working-directory: workers
        run: cargo test --release --lib resolves_bcmr_publication_uris

      - name: Full worker library tests
        working-directory: workers
        run: cargo test --release --lib

      - name: Clippy
        working-directory: workers
        run: cargo clippy --all-targets --release
